version: 2

models:
  - name: stg_customers
    description: "Cleaned, typed customer records from the raw customer feed."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests: [not_null, unique]
      - name: email
        description: "Lowercased customer email."
        tests: [not_null]

  - name: stg_products
    description: "Cleaned product catalog with typed unit price."
    columns:
      - name: product_id
        description: "Primary key for a product."
        tests: [not_null, unique]
      - name: unit_price
        tests: [not_null]

  - name: stg_orders
    description: >
      Order headers with attributes flattened from the semi-structured JSON
      payload (channel, device, promo).
    columns:
      - name: order_id
        description: "Primary key for an order."
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_channel
        tests:
          - accepted_values:
              values: ['web', 'app', 'store']

  - name: stg_order_items
    description: "Order line items exploded from the JSON payload items[] array via LATERAL FLATTEN."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests: [not_null]
